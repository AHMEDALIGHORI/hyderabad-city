<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/scene.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <div class="clip" id="m1" data-composition-src="compositions/s1.html" data-composition-id="s1" data-start="0" data-duration="2.6"></div>
      <div class="clip" id="m2" data-composition-src="compositions/s2.html" data-composition-id="s2" data-start="2.6" data-duration="3.0"></div>
      <div class="clip" id="m3" data-composition-src="compositions/s3.html" data-composition-id="s3" data-start="5.6" data-duration="3.2"></div>
      <div class="clip" id="m4" data-composition-src="compositions/s4.html" data-composition-id="s4" data-start="8.8" data-duration="3.2"></div>
      <div class="clip" id="m5" data-composition-src="compositions/s5.html" data-composition-id="s5" data-start="12.0" data-duration="3.2"></div>
      <div class="clip" id="m6" data-composition-src="compositions/s6.html" data-composition-id="s6" data-start="15.2" data-duration="4.8"></div>
      <audio id="music" data-start="0" data-duration="20" data-volume="0.6" src="assets/music.mp3"></audio>
    </div>
    <style>
      #root > .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    </style>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
