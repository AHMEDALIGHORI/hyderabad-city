<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/scene.css" />
  </head>
  <body>
    <div id="root" data-composition-id="s5" data-start="0" data-duration="6.8" data-width="1920" data-height="1080">
      <img class="shot" id="s5-shot" src="assets/hero.png" alt="Hyderabad, Sindh" />
      <div class="veil"></div>
      <div class="copy">
        <p class="kicker" id="s5-kicker">BLENDER → GLTF → THREE.JS</p>
        <h2 id="s5-title">Built in Blender.<br />Filmed in the browser.</h2>
        <p class="sub" id="s5-sub">Eleven towns, eleven signs, one sunset.</p>
        <p class="url" id="s5-url">ahmedalighori.github.io/hyderabad-city</p>
        <span class="badge" id="s5-badge">11 towns · 147,732 faces · 2.9 MB</span>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s5-shot", { scale: 1.1 }, { scale: 1.0, duration: 6.8, ease: "power1.out" }, 0);
      tl.fromTo("#s5-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.15);
      tl.fromTo("#s5-title", { opacity: 0, y: 34, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.62, ease: "power4.out" }, 0.28);
      tl.fromTo('#s5-sub', { opacity: 0 }, { opacity: 1, duration: 0.45 }, 0.5);
      tl.fromTo('#s5-url', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 1.1);
      tl.fromTo('#s5-badge', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' }, 1.45);
      window.__timelines["s5"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
