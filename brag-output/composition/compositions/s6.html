<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/scene.css" />
  </head>
  <body>
    <div id="root" data-composition-id="s6" data-start="0" data-duration="4.8" data-width="1920" data-height="1080">
      <img class="shot" id="s6-shot" src="assets/wide.png" alt="Hyderabad at dusk" />
      <div class="veil"></div>
      <div class="copy">
        <p class="kicker" id="s6-kicker">BLENDER → GLTF → THREE.JS</p>
        <h2 id="s6-title">Built in Blender.<br />Filmed in the browser.</h2>
        <p class="sub" id="s6-sub">Eleven towns, eleven signs, one sunset.</p>
        <p class="url" id="s6-url">ahmedalighori.github.io/hyderabad-city</p>
        <span class="badge" id="s6-badge">147,732 faces · 817 KB · 11 towns</span>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s6-shot", { scale: 1.08 }, { scale: 1.0, duration: 4.8, ease: "power1.out" }, 0);
      tl.fromTo("#s6-kicker", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.1);
      tl.fromTo("#s6-title", { opacity: 0, y: 40, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power4.out" }, 0.2);
      tl.fromTo("#s6-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.6);
      tl.fromTo("#s6-url", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.0);
      tl.fromTo("#s6-badge", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 1.35);
      window.__timelines["s6"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
